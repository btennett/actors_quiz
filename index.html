<div class="app">
  <header class="top">
    <div class="top-row">
      <h1 class="brand"><em>Hollywood</em> Stars Quiz</h1>
      <div class="score" id="scoreBox"></div>
    </div>
    <ol class="dots" id="dots" aria-hidden="true"></ol>
  </header>

  <main class="stage" id="stage">
    <section class="setup" id="setup">
      <div class="notice" id="notice"></div>
    </section>

    <section class="card" id="play" hidden>
      <div class="meta" id="cat"></div>
      <h2 class="question" id="question"></h2>
      <div class="photo-box"><img class="photo" id="photo" alt=""><div class="photo-msg" id="photoMsg" hidden></div></div>
      <ol class="options" id="options"></ol>
      <div class="fact" id="fact" hidden>
        <p class="verdict" id="verdict"></p>
        <p id="factText"></p>
        <p class="credit" id="creditRow"><a id="credit" href="#" target="_blank" rel="noopener">Photo: Wikimedia Commons (author and licence)</a></p>
      </div>
    </section>

    <section class="over" id="over" hidden>
      <div class="final">
        <p class="big" id="finalScore"></p>
        <p id="finalMsg"></p>
        <p class="best" id="best"></p>
      </div>
      <div class="row">
        <button class="ghost" id="shareBtn" type="button">Share score</button>
      </div>
      <h2 class="review-title">Your answers</h2>
      <ol class="review" id="review"></ol>
    </section>
  </main>

  <footer class="actions">
    <button class="btn" id="mainBtn" type="button" disabled>Pick an era</button>
    <p class="foot" id="foot"></p>
  </footer>
  <div class="sr" aria-live="polite" id="live"></div>
</div>

<script>
// ---------- Load and check the content ----------
const $ = id => document.getElementById(id);
const KEYS = "ABCDEF";
const ALL_ERAS = "all";
const PREVIEW = new URLSearchParams(location.search).has("preview");
let DATA, ERAS = [], ACTORS = [], PER = 12, NOPT = 5;
const shuffle = a => { a = [...a]; for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; };

try {
  DATA = JSON.parse($("quiz-data").textContent);
  PER = Math.max(1, +(DATA.settings && DATA.settings.questionsPerGame) || 12);
  NOPT = Math.min(6, Math.max(3, +(DATA.settings && DATA.settings.optionsPerQuestion) || 5));
  ERAS = Array.isArray(DATA.eras) ? DATA.eras : [];
  (DATA.actors || []).forEach((a, n) => {
    if (!a.name || !a.era) console.warn(`Actor ${n + 1} skipped: missing name or era.`);
    else if (!ERAS.includes(a.era)) console.warn(`${a.name} skipped: era "${a.era}" isn't in the eras list.`);
    else ACTORS.push({ ...a, photo: (a.photo || "").trim(), gender: a.gender === "f" ? "f" : "m" });
  });
} catch (e) {
  console.error(e);
}

// Photos come straight from Wikimedia Commons. "width" asks Commons for a
// resized copy, so phones don't download the full-size original.
const photoSrc = (file, width) => "https://commons.wikimedia.org/wiki/Special:FilePath/" + encodeURIComponent(file) + "?width=" + width;
const photoPage = file => "https://commons.wikimedia.org/wiki/File:" + encodeURIComponent(file.replace(/ /g, "_"));
const askable = era => ACTORS.filter(a => (PREVIEW || a.photo) && (era === ALL_ERAS || a.era === era));
const eraName = era => era === ALL_ERAS ? "All eras" : era;

// Wrong answers: same gender, same era first, then same gender from other eras.
function makeQuestion(a) {
  const others = ACTORS.filter(o => o.name !== a.name);
  const sameEra = shuffle(others.filter(o => o.gender === a.gender && o.era === a.era));
  const sameGender = shuffle(others.filter(o => o.gender === a.gender && o.era !== a.era));
  const rest = shuffle(others.filter(o => o.gender !== a.gender));
  const wrong = [...new Set([...sameEra, ...sameGender, ...rest].map(o => o.name))].slice(0, NOPT - 1);
  return { era: a.era, photo: a.photo, answer: a.name, options: [a.name, ...wrong], fact: a.fact };
}

// ---------- Game ----------
let chosenEra = ALL_ERAS, round = [], i = 0, score = 0, answers = [], picked = false, mode = "setup";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
const total = () => round.length;
function showOnly(id) { ["setup", "play", "over"].forEach(s => { $(s).hidden = s !== id; }); mode = id; }

function header() {
  if (mode === "setup") { $("scoreBox").innerHTML = PREVIEW ? "Preview mode" : ""; $("dots").innerHTML = ""; return; }
  const done = mode === "over";
  $("scoreBox").innerHTML = done ? `Done · Score <b>${score}</b>`
    : `Q <b>${Math.min(i + 1, total())}</b>/${total()} · Score <b>${score}</b>`;
  $("dots").style.gridTemplateColumns = `repeat(${total()},1fr)`;
  $("dots").innerHTML = round.map((_, k) => {
    const c = k < answers.length ? (answers[k].ok ? "ok" : "no") : (k === i && !done ? "now" : "");
    return `<li class="${c}"></li>`;
  }).join("");
}

// ---------- No photos yet ----------
function setup() {
  showOnly("setup");
  $("notice").innerHTML = `<p><b>No photos added yet.</b> Each actor in the quiz-data block has an empty <code>"photo": ""</code>. Add the Wikimedia Commons file name for each one (without <code>File:</code>), and that actor joins the quiz.</p>
    <p>To try the quiz now with placeholders, <a href="?preview">open preview mode</a>.</p>`;
  const b = $("mainBtn"); b.disabled = true; b.textContent = "No photos yet";
  header();
}

// ---------- Questions ----------
// Show the photo, with a message while it loads, if it fails, or if none is set (preview).
function setPhoto(x) {
  const img = $("photo"), msg = $("photoMsg"), at = i;
  msg.hidden = false;
  if (!x.photo) {
    img.removeAttribute("src"); img.style.visibility = "hidden";
    msg.textContent = `Preview: no photo added for this actor yet.`;
    return;
  }
  img.style.visibility = "";
  msg.textContent = "Fetching the photo…";
  img.onload = () => { if (at === i) msg.hidden = true; };
  img.onerror = () => { if (at === i) msg.textContent = "This photo wouldn't load. Pick any answer to move on."; };
  img.src = photoSrc(x.photo, 800);
}

function show() {
  const x = round[i];
  picked = false;
  x._order = shuffle(x.options);
  $("cat").textContent = x.era;
  setPhoto(x);
  $("question").textContent = "Who is this?";
  $("options").innerHTML = x._order.map((o, k) =>
    `<li><button class="opt" type="button" id="opt-${k}" data-v="${esc(o)}"><span class="key">${KEYS[k]}</span><span class="txt">${esc(o)}</span><span class="res" aria-hidden="true"></span></button></li>`
  ).join("");
  $("fact").hidden = true;
  const b = $("mainBtn"); b.disabled = true; b.textContent = "Pick an answer";
  $("stage").scrollTop = 0;
  header();
}

function choose(value) {
  if (picked) return;
  picked = true;
  const x = round[i], ok = value === x.answer;
  if (ok) score++;
  answers.push({ x, value, ok });
  buzz(ok ? 20 : [30, 40, 30]);

  document.querySelectorAll(".opt").forEach(btn => {
    const v = btn.dataset.v; btn.disabled = true;
    if (v === x.answer) { btn.classList.add("correct"); btn.querySelector(".res").textContent = "✓"; }
    else if (v === value) { btn.classList.add("wrong"); btn.querySelector(".res").textContent = "✗"; }
    else btn.classList.add("faded");
  });

  const vd = $("verdict");
  vd.textContent = ok ? "Correct!" : `Not quite. It's ${x.answer}.`;
  vd.className = "verdict " + (ok ? "ok" : "no");
  $("factText").textContent = x.fact || "";
  $("factText").hidden = !x.fact;
  $("creditRow").hidden = !x.photo;
  if (x.photo) $("credit").href = photoPage(x.photo);
  $("fact").hidden = false;
  $("live").textContent = vd.textContent + " " + (x.fact || "");

  const b = $("mainBtn");
  b.disabled = false;
  b.textContent = i === total() - 1 ? "See your results →" : "Next question →";
  b.focus({ preventScroll: true });
  header();
  requestAnimationFrame(() => $("fact").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest" }));
}

function finish() {
  showOnly("over");
  const n = total(), pct = score / n;
  $("finalScore").textContent = `${score}/${n}`;
  $("finalMsg").textContent = pct >= .9 ? "Outstanding. A true film buff." : pct >= .7 ? "Great result. You know your stars." : pct >= .5 ? "Solid effort. Have another go." : "A tough set. Every round is different, so try again.";
  let best = score;
  try { const key = "stars-best-" + (DATA.version || "1") + "-" + chosenEra; best = Math.max(score, +(localStorage.getItem(key) || 0)); localStorage.setItem(key, best); } catch (e) {}
  $("best").textContent = `Best score on this device: ${best}/${n}`;
  $("review").innerHTML = answers.map(a =>
    `<li><span class="mark ${a.ok ? "ok" : "no"}" aria-label="${a.ok ? "correct" : "wrong"}">${a.ok ? "✓" : "✗"}</span>${a.x.photo ? `<img class="thumb" src="${esc(photoSrc(a.x.photo, 120))}" alt="Photo of ${esc(a.x.answer)}">` : `<span class="thumb" aria-hidden="true"></span>`}
     <span class="ans">${a.ok ? `<b>${esc(a.x.answer)}</b>` : `You said ${esc(a.value)} · answer: <b>${esc(a.x.answer)}</b>`}</span></li>`
  ).join("");
  $("shareBtn").textContent = "Share score";
  const b = $("mainBtn"); b.disabled = false; b.textContent = "Play again ↻"; b.focus({ preventScroll: true });
  $("stage").scrollTop = 0;
  header();
}

function start() {
  const pool = askable(chosenEra);
  round = shuffle(pool).slice(0, Math.min(PER, pool.length)).map(makeQuestion);
  i = 0; score = 0; answers = [];
  showOnly("play");
  round.slice(1).forEach(x => { if (x.photo) new Image().src = photoSrc(x.photo, 800); });   // preload the rest of the round
  show();
}

// Share the score with the phone's share sheet, or copy it if that isn't available.
async function share() {
  const text = `I scored ${score}/${total()} on the Hollywood Stars Quiz.`;
  try { if (navigator.share) { await navigator.share({ text }); return; } }
  catch (e) { if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(text); $("shareBtn").textContent = "Copied ✓"; }
  catch (e) { $("shareBtn").textContent = "Couldn't share"; }
}

$("shareBtn").addEventListener("click", share);
$("options").addEventListener("click", e => { const b = e.target.closest(".opt"); if (b) choose(b.dataset.v); });
$("mainBtn").addEventListener("click", () => {
  if (mode === "over") start();
  else if (picked) { if (i < total() - 1) { i++; show(); } else finish(); }
});
document.addEventListener("keydown", e => {
  if (e.target.tagName === "A") return;
  const k = e.key.toUpperCase(), idx = KEYS.indexOf(k);
  if (mode === "play" && !picked && idx > -1 && idx < (round[i]?._order.length || 0) && k.length === 1) { e.preventDefault(); choose(round[i]._order[idx]); }
  else if (e.key === "Enter" && !$("mainBtn").disabled && document.activeElement !== $("mainBtn") && !(document.activeElement && document.activeElement.closest(".ghost"))) { e.preventDefault(); $("mainBtn").click(); }
});

if (ACTORS.length >= NOPT && ERAS.length) {
  const withPhotos = ACTORS.filter(a => a.photo).length;
  $("foot").textContent = `${ACTORS.length} stars · ${withPhotos} with photos · photos: Wikimedia Commons · v${(DATA.version || "1").split(" ")[0]}`;
  if (askable(ALL_ERAS).length) start(); else setup();
} else {
  showOnly("play");
  $("play").innerHTML = `<div class="error">The quiz content couldn't be loaded. Check the quiz-data block for a JSON typo, such as a missing comma or quote.</div>`;
  $("mainBtn").textContent = "No questions loaded";
}
</script>
